name = "tickets-handler"
version = "0.1.0"
package = "/home/colin/work/actors/tickets/target/wasm32-unknown-unknown/release/tickets_handler.wasm"
static_package = true
# The store handler intentionally omits `base_path`: theater falls back to
# `$THEATER_HOME/store/<store_id>`. Because store_id matches the acceptor's,
# both actors share the same backing store as long as they run under the
# same THEATER_HOME (default `$HOME/.theater`).

[[handler]]
type = "self"

[[handler]]
type = "tcp"

[handler.client_tls]
enabled = true

[[handler]]
type = "store"
store_id = "tickets"

# Needed so theater:simple/message-server-host.request resolves at
# instantiation: that host function is registered by the message-server handler.
# The handler only *sends* (routes writes to the singleton ticket-store and
# awaits the reply) — it never calls register(), so it joins no mailbox and
# exports no receive-side interface; the handler stays a pure HTTP⇄message
# adapter. Without this handler the actor fails to instantiate on the unknown
# `request` import.
[[handler]]
type = "message-server"
