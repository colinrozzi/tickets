[target.wasm32-unknown-unknown]
# Plain self-contained build (packr 0.24 / in-module-state model). setup_guest!()
# links dlmalloc into the cdylib, so it exports its own GROWABLE memory +
# __pack_alloc/__pack_free + lifecycle and imports only host theater:simple/*.
# No fixed-base recipe, no packr::link composition, no compose step. crane
# ignores these rustflags; the flake passes the same two link-args via
# CARGO_ENCODED_RUSTFLAGS. This file is for local cargo use.
rustflags = [
    "-C", "link-arg=--export-memory",
    "-C", "link-arg=--no-entry",
]
